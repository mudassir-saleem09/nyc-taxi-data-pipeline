# models/staging/schema.yml
# Data quality tests for the staging layer.

version: 2

models:
  - name: stg_yellow_taxi_h1
    columns:
      - name: pickup_datetime
        tests:
          - not_null

      - name: dropoff_datetime
        tests:
          - not_null

      - name: vendor_id
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 6, 7]

      - name: payment_type
        tests:
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6]

      - name: rate_code_id
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 99]

      - name: fare_amount
        tests:
          - not_null

      - name: trip_distance
        tests:
          - not_null

